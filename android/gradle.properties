# JVM args tuned for constrained build environments (CI / low-RAM machines).
# The Flutter template default of -Xmx8G OOMs on machines with < 8 GB RAM.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Arm64-only debug verification builds (disk-constrained CI box):
# keeps the abiFilters set in app/build.gradle.kts so native tasks, engine
# artifacts and gradle transforms stay arm64-only.
disable-abi-filtering=true
